spring.application.name=Proyecto1

server.port=9002

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=trace
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# El esquema se gestiona manualmente con los scripts de database/schema_fase*.sql, no se
# deja que Hibernate cree/altere tablas en cada arranque.
spring.data.jpa.repositories.enabled=true
# Sin esto, Hibernate convierte TODOS los nombres a snake_case (incluso los explicitos en
# @Table/@Column), lo que no coincide con los scripts en database/*.sql ni con los nombres de
# columna usados en el codigo. Con el nombrado "standard" se respetan los nombres tal cual.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# API key de Google Maps Geocoding (tarea programada de trayectos). Se deja vacia por
# defecto; si no se configura, la tarea se omite sin fallar.
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# Clave para firmar los tokens: cámbiala por una frase larga tuya (mínimo 64 caracteres)
labs.jwt.secret=cambia-esta-clave-por-una-muy-larga-de-minimo-64-caracteres-para-hs512-2026
# true = el resto de la app (Entregas 1 y 2) sigue abierta como antes. Ponlo en false cuando
# configures la seguridad de la Entrega 2.
labs.security.permit-rest=true

# --- Lab 3 (Google Maps + @Scheduled) ---
# La llave se lee de la variable de entorno GOOGLE_MAPS_API_KEY (o pega la tuya aquí, sin subirla a GitHub)
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
# La tarea programada está APAGADA por defecto (cada ejecución gasta consultas de Google). Pon true para probar.
labs.lab3.scheduler.enabled=false
labs.lab3.cron=*/30 * * * * ?
# Actividad 7: cambia ubicaciones al azar
labs.lab3.random.enabled=false
labs.lab3.random.cron=0 */2 * * * ?

# Ejemplos de cron para la actividad 8 (segundo minuto hora día-mes mes día-semana):
#   cada 2 minutos:                          0 */2 * * * ?
#   todos los lunes a las 5:17 pm:           0 17 17 ? * MON
#   3 veces al día (8, 13 y 18 h) vie/lun/mié: 0 0 8,13,18 ? * FRI,MON,WED

# --- Lab 4 (Excel) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.data.rest.base-path=/data-rest
logging.level.org.springdoc=DEBUG
debug=true
springdoc.enable-data-rest=false
springdoc.api-docs.version=openapi_3_0
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/api-docs/swagger-ui.html
