spring.application.name=Proyecto1

server.port = 9002

# Configurar la coneccion a la base de datos
spring.datasource.url = jdbc:mysql://localhost:3306/PPOOII
spring.datasource.username = root
spring.datasource.password = mysqlroot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Indica si debe mostrar el log de las consultas sql ejecutadas
# Bueno a la hora de depurar
spring.jpa.show-sql= true

# Configurar Hibernate: crea/actualiza automaticamente las tablas (incluye los
# checks) a partir de las entidades, para poder probar en Postman sin correr scripts SQL manuales.
spring.jpa.hibernate.ddl-auto= update
spring.data.jpa.repositories.enabled=true
